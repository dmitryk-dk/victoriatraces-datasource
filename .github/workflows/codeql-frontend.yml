name: CodeQL / frontend

# Static security analysis for TypeScript/React code. Findings show up
# under the repo's Security tab → Code scanning.
on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/codeql-frontend.yml'
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - '!src/**/*.test.ts'
      - '!src/**/*.test.tsx'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/codeql-frontend.yml'
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - '!src/**/*.test.ts'
      - '!src/**/*.test.tsx'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3