name: CI / frontend

# Runs only when TypeScript/React code, JS deps, build config, or this
# workflow itself changes. Backend-only PRs skip this job.
on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/ci-frontend.yml'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'webpack.config.ts'
      - 'jest.config.js'
      - 'tsconfig.json'
      - '.config/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/ci-frontend.yml'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'webpack.config.ts'
      - 'jest.config.js'
      - 'tsconfig.json'
      - '.config/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

  build:
    name: build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm run build

      - name: Upload frontend bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-${{ github.sha }}
          path: plugins/victoriametrics-traces-datasource
          if-no-files-found: error
          retention-days: 7