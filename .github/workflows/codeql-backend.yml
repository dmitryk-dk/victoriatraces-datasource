name: CodeQL / backend

# Static security analysis for the Go backend. Findings show up under
# the repo's Security tab → Code scanning.
on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/codeql-backend.yml'
      - 'go.*'
      - 'pkg/**'
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/codeql-backend.yml'
      - 'go.*'
      - 'pkg/**'
  schedule:
    # Weekly scan catches CVEs that land after a PR-quiet week.
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3