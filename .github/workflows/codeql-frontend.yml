name: CodeQL / frontend

# Static security analysis for TypeScript/React code. Disabled on push/PR
# because GitHub Code Scanning is not available on private repos without
# GitHub Advanced Security. Re-enable the push/pull_request/schedule
# triggers once the repo is public (or GHAS is purchased) and Code scanning
# is turned on in repo Settings → Security → Code security.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3