name: CodeQL / backend

# Static security analysis for the Go backend. Disabled on push/PR because
# GitHub Code Scanning is not available on private repos without GitHub
# Advanced Security. Re-enable the push/pull_request/schedule triggers once
# the repo is public (or GHAS is purchased) and Code scanning is turned on
# in repo Settings → Security → Code security.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3