services:
  victoriatraces:
    image: victoriametrics/victoria-traces:latest
    ports:
      - "10428:10428"
      - "4317:4317"
    command:
      - "--storageDataPath=/storage"
      - "--retentionPeriod=7d"
      - "--otlpGRPCListenAddr=:4317"
      # v0.8.2+ defaults otlpGRPC.tls to true, which then demands a key file.
      - "--otlpGRPC.tls=false"
    volumes:
      - victoriatraces-data:/storage
    networks:
      - plugin-network

  grafana:
    build:
      context: .config
      args:
        grafana_version: latest
        grafana_image: grafana
        development: true
    ports:
      - "3000:3000"
    environment:
      GF_LOG_FILTERS: "plugin.victoriametrics-traces-datasource:debug"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: victoriametrics-traces-datasource,victoriametrics-traces-panel,victoriametrics-traces-nodegraph-panel,victoriametrics-traces-charts-panel
    volumes:
      - ./plugins/victoriametrics-traces-datasource:/var/lib/grafana/plugins/victoriametrics-traces-datasource
      - ./plugins/victoriametrics-traces-panel:/var/lib/grafana/plugins/victoriametrics-traces-panel
      - ./plugins/victoriametrics-traces-nodegraph-panel:/var/lib/grafana/plugins/victoriametrics-traces-nodegraph-panel
      - ./plugins/victoriametrics-traces-charts-panel:/var/lib/grafana/plugins/victoriametrics-traces-charts-panel
      - ./provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - victoriatraces
    networks:
      - plugin-network

networks:
  plugin-network:
    driver: bridge

volumes:
  victoriatraces-data:
  grafana-data:
